# Render Blueprint for VerShipGo — ONE Node web service that serves the unified
# app (public site + /admin) AND the API + Socket.IO, plus a managed Postgres DB.
#
# First deploy: push this file, then in Render create a new Blueprint from the
# repo. Fill the secret env vars marked `sync: false` in the dashboard, then run
# the one-time MySQL -> Postgres data migration (see RENDER_MIGRATION.md).

databases:
  - name: vershipgo-db
    databaseName: vershipgo
    plan: basic-256mb # adjust to your data size / budget
    postgresMajorVersion: "16"

services:
  # ---- Single service: Express (API + Socket.IO) serving the unified frontend ----
  - type: web
    name: vershipgo
    runtime: node
    rootDir: server
    plan: starter # Socket.IO + persistent disk require a paid instance (no scale-to-zero)
    # Install the server (npm), then build the unified frontend (pnpm) into
    # website/dist, which shipone.js serves at / (public) and /admin (admin).
    # website/ is a standalone app that lives inside a pnpm workspace root, so it
    # must install with --ignore-workspace (a plain install prunes its deps).
    buildCommand: npm install && cd ../website && corepack enable && pnpm install --ignore-workspace && pnpm run build
    startCommand: node shipone.js
    healthCheckPath: /
    disk:
      name: uploads
      mountPath: /var/data # user uploads live here (persists across deploys)
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: vershipgo-db
          property: connectionString
      - key: UPLOAD_DIR
        value: /var/data
      # PORT is injected by Render automatically; shipone.js reads process.env.PORT.
      # The frontend calls the API same-origin, so no VITE_API_URL/REACT_APP_API_URL
      # build vars are needed.
      - key: PUBLIC_BASE_URL
        sync: false # set to the service's public URL / custom domain
      - key: JWT_SECRET
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_PUBLISHABLE_KEY
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: FREIGHT_FORWARDER_NOTIFY_EMAIL
        sync: false
