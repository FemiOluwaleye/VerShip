# Render Blueprint for VerShipGo — ONE Node web service that serves the unified
# app (public site + /admin) AND the API + Socket.IO, plus a managed Postgres DB.
#
# First deploy: push this file, then in Render create a new Blueprint from the
# repo. Fill the secret env vars marked `sync: false` in the dashboard, then run
# the one-time MySQL -> Postgres data migration (see RENDER_MIGRATION.md).

databases:
  - name: vershipgo-db
    databaseName: vershipgo
    plan: basic-256mb # adjust to your data size / budget
    postgresMajorVersion: "16"

services:
  # ---- Single service: Express (API + Socket.IO) serving the unified frontend ----
  - type: web
    name: vershipgo
    runtime: node
    rootDir: server
    plan: starter # Socket.IO + persistent disk require a paid instance (no scale-to-zero)
    # Install the server (npm), then build the unified frontend (pnpm) into
    # website/dist, which shipone.js serves at / (public) and /admin (admin).
    # website/ is a standalone app that lives inside a pnpm workspace root, so it
    # must install with --ignore-workspace (a plain install prunes its deps).
    #
    # After the build, the SEO prerender writes real per-route HTML into dist/ so
    # crawlers get titles/meta/canonical instead of an empty shell. It is run
    # BEST-EFFORT (`|| echo …`): if Chromium can't launch in the native build
    # image it skips without failing the deploy. Verify from the build log
    # ("N/N routes prerendered" = worked; "Could not launch Chromium … Skipping"
    # = falls back to the plain SPA — switch this service to a Docker runtime
    # with the Chromium libs if you need prerender to run). Puppeteer's Chromium
    # download is enabled via website/package.json > pnpm.onlyBuiltDependencies.
    buildCommand: npm install && cd ../website && corepack enable && pnpm install --ignore-workspace && pnpm run build && (node scripts/prerender.mjs || echo '[prerender] skipped — Chromium could not launch in this build image; serving plain SPA')
    startCommand: node shipone.js
    healthCheckPath: /
    disk:
      name: uploads
      mountPath: /var/data # user uploads live here (persists across deploys)
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: vershipgo-db
          property: connectionString
      - key: UPLOAD_DIR
        value: /var/data
      # PORT is injected by Render automatically; shipone.js reads process.env.PORT.
      # The frontend calls the API same-origin, so the VITE_API_URL / admin URL
      # build vars default to '' and '/admin' — no need to set them here.
      - key: PUBLIC_BASE_URL
        sync: false # set to the service's public URL / custom domain
      - key: JWT_SECRET
        sync: false
      # Pepper mixed into OTP / password-reset-ticket hashes (helper/otpHelper.js). Falls back to
      # JWT_SECRET if unset, but set a distinct long random value here.
      - key: OTP_PEPPER
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_PUBLISHABLE_KEY
        sync: false
      # Required by the hardened Stripe webhook handler (shipone.js): unverifiable
      # webhooks are REJECTED, so an unset secret breaks all webhooks in prod.
      # Set this to the signing secret Stripe shows when you add the webhook
      # endpoint (https://<domain>/api/stripe/webhook or your configured path).
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      # Build-time (Vite) key baked into the bundle. Used by geocoding + the
      # Google driving-distance calc that now drives pickup/delivery billing, so
      # it MUST be present when the frontend builds or distance pricing breaks.
      # Restrict this key to the prod domain(s) in the Google Cloud console.
      - key: VITE_GOOGLE_MAPS_API_KEY
        sync: false
      # Email delivery. When RESEND_API_KEY is set the app sends via Resend; the SMTP_* vars
      # below are the fallback transport. MAIL_FROM must be a sender on a Resend-verified domain
      # (e.g. "VerShip <no-reply@vershipgo.com>") or sends will be rejected.
      - key: RESEND_API_KEY
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: FREIGHT_FORWARDER_NOTIFY_EMAIL
        sync: false
