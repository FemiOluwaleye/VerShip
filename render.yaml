# Render Blueprint for VerShipGo — one Node web service (API + Socket.IO),
# a managed Postgres DB, and two static React frontends.
#
# First deploy: push this file, then in Render create a new Blueprint from the
# repo. Fill the secret env vars marked `sync: false` in the dashboard, then run
# the one-time MySQL -> Postgres data migration (see RENDER_MIGRATION.md).

databases:
  - name: vershipgo-db
    databaseName: vershipgo
    plan: basic-256mb # adjust to your data size / budget
    postgresMajorVersion: "16"

services:
  # ---- Backend: Express + Sequelize (Postgres) + Socket.IO ----
  - type: web
    name: vershipgo-api
    runtime: node
    rootDir: server
    plan: starter # Socket.IO + persistent disk require a paid instance (no scale-to-zero)
    buildCommand: npm install
    startCommand: node shipone.js
    healthCheckPath: /
    disk:
      name: uploads
      mountPath: /var/data # user uploads live here (persists across deploys)
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: vershipgo-db
          property: connectionString
      - key: UPLOAD_DIR
        value: /var/data
      # PORT is injected by Render automatically; shipone.js reads process.env.PORT.
      - key: PUBLIC_BASE_URL
        sync: false # set to the API's public URL / custom domain
      - key: JWT_SECRET
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_PUBLISHABLE_KEY
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: FREIGHT_FORWARDER_NOTIFY_EMAIL
        sync: false

  # ---- Admin panel (Create React App) ----
  - type: web
    name: vershipgo-admin
    runtime: static
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: ./build
    envVars:
      - key: REACT_APP_API_URL
        sync: false # e.g. https://vershipgo-api.onrender.com/admin
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  # ---- Public website (Vite) ----
  - type: web
    name: vershipgo-website
    runtime: static
    rootDir: website
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_URL
        sync: false # e.g. https://vershipgo-api.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
